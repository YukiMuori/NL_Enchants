# ══════════════════════════════════════════════════════════════════════════════
#  NL_Enchants — resonance (one file per enchant)
#  Docs: docs/enchantments/resonance.md
#
#  v0.3.1 — slot checks moved OUT of MythicMobs skill files: MythicEnchants
#  conditions fail to load in pack skill files (field-verified 0.3.0) and
#  are only guaranteed inside enchantment skill lines (official pattern:
#  "?mench{...}" per the Has-Enchantment condition page).
#
#  Tiers, evaluated at damage time (accurate, event-time):
#    FULL set  → Regeneration II / 8s   (four plain inline conditions)
#    otherwise → Regeneration I  / 3s   (fallback — weaker potion respects
#                 the stronger one because potion force defaults to false)
#  If the ?mench gate ever failed to load, the FULL line is skipped and the
#  base tier still works — graceful degradation by design.
# ══════════════════════════════════════════════════════════════════════════════

nl:resonance:
  Display: '<gold>Resonance'
  Description: '<gray>Attuned pieces hum together, knitting your wounds when you are struck.'
  Rarity: LEGENDARY
  MaxLevel: 1
  AnvilCost: 7
  ValidSlots:
  - HEAD
  - CHEST
  - LEGS
  - FEET
  SupportedItems: '#minecraft:enchantable/armor'
  Enchanting:
    Weight: 1
    MinCost: 30
    MaxCost: 50
  Skills:
  - skill{s=NL_RESONANCE_FULL} @self ~onDamaged ?mench{id=nl:resonance;slot=HEAD} ?mench{id=nl:resonance;slot=CHEST} ?mench{id=nl:resonance;slot=LEGS} ?mench{id=nl:resonance;slot=FEET}
  - skill{s=NL_RESONANCE_ANY} @self ~onDamaged
  - skill{s=NL_VFX_RESONANCE_LINK} @self ~onEquip

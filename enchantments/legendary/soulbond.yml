# ══════════════════════════════════════════════════════════════════════════════
#  NL_Enchants — soulbond (one file per enchant)
#  Docs: docs/enchantments/soulbond.md
#
#  v0.3.1 — the outfit-web extension used MythicEnchants conditions inside a
#  MythicMobs skill file, which fails to load (field-verified 0.3.0).
#  Redesigned to the exact official RecoverItem example: each bonded piece
#  protects ITSELF on death (3 charges stored on the item). Wearing the full
#  set naturally protects the whole outfit — no cross-slot checks needed.
# ══════════════════════════════════════════════════════════════════════════════

nl:soulbond:
  Display: '<gold>Soulbond'
  Description: '<gray>Each bonded piece refuses to leave you — up to three times.'
  Rarity: LEGENDARY
  MaxLevel: 1
  AnvilCost: 7
  ValidSlots:
  - HEAD
  - CHEST
  - LEGS
  - FEET
  SupportedItems: '#minecraft:enchantable/armor'
  Enchanting:
    Weight: 2
    MinCost: 30
    MaxCost: 50
  Skills:
  - recoveritem{slot=TRIGGER;limit=3;reequip=true} @trigger ~onDeath
  - skill{s=NL_VFX_SOULBOND_LINK} @self ~onEquip

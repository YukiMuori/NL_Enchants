# ══════════════════════════════════════════════════════════════════════════════
#  NL_Enchants — WINGED LEAP  (ID: nl:double_jump, kept for item compatibility)
#  Docs: docs/enchantments/double_jump.md
#
#  Press the jump key again while airborne to ride the wind — an extra
#  directional leap. Extra jumps by level: I=1, II=2, III=5.
#
#  Architecture (R1-R9 compliant; ME conditions only on these direct lines):
#    ~onEquip ?mench level=N → installs the level-matched listener set
#      · onJump aura mechanic  → arms N charge auras (c1..c5) on ground jump
#      · OnInput component     → jump-key input while airborne consumes one
#    each charge consumed = one directional impulse + flap VFX
#    consuming the LAST charge = finisher VFX (large burst + ring + trail)
#    ~onUnequip → removes every aura (arm/input/c1..c5) — guaranteed cleanup
#
#  Holding the jump key re-fires the input once per second — reads as
#  continuous wing flapping while charges last (documented behavior).
# ══════════════════════════════════════════════════════════════════════════════

nl:double_jump:
  Display: '<aqua>Winged Leap'
  Description: '<gray>Press jump again mid-air to ride the wind — again and again.'
  Rarity: EPIC
  MaxLevel: 3
  AnvilCost: 7
  ValidSlots:
  - FEET
  SupportedItems: '#minecraft:enchantable/foot_armor'
  Enchanting:
    Weight: 2
    MinCost: 22
    MaxCost: 44
  Skills:
  - skill{s=NL_ENCHANT_WINGED_EQUIP_L1} @self ~onEquip ?mench{id=nl:double_jump;level=1}
  - skill{s=NL_ENCHANT_WINGED_EQUIP_L2} @self ~onEquip ?mench{id=nl:double_jump;level=2}
  - skill{s=NL_ENCHANT_WINGED_EQUIP_L3} @self ~onEquip ?mench{id=nl:double_jump;level=3}
  - skill{s=NL_ENCHANT_WINGED_UNEQUIP} @self ~onUnequip

nl:climber:
  Display: '<white>Climber'
  Description: '<gray>Sprint to climb ladders and vines faster; jump to leap off them.'
  Rarity: UNCOMMON
  MaxLevel: 1
  AnvilCost: 2
  ValidSlots:
  - FEET
  SupportedItems: '#minecraft:enchantable/foot_armor'
  Enchanting:
    Weight: 5
    MinCost: 8
    MaxCost: 30
  Skills:
  - skill{s=NL_ENCHANT_CLIMBER_EQUIP} @self ~onEquip
  - skill{s=NL_ENCHANT_CLIMBER_UNEQUIP} @self ~onUnequip

# ══════════════════════════════════════════════════════════════════════════════
#  NL_Enchants — executioner (one file per enchant)
#  Docs: docs/enchantments/executioner.md   ·   https://wiki.mythiccraft.io/mythicenchants
#
#  RELIABILITY RULES (v0.3.0):
#   · dispatch lines mirror official MythicEnchants examples exactly
#   · metaskills use <skill.var.enchant-level> (the documented in-context form)
#   · one condition per line; no comma lists inside conditions
# ══════════════════════════════════════════════════════════════════════════════
nl:executioner:
  Display: '<aqua>Executioner'
  Description: '<gray>Strikes against weakened targets hit harder — and you can see when they are vulnerable.'
  Rarity: RARE
  MaxLevel: 3
  AnvilCost: 4
  ValidSlots:
  - MAINHAND
  SupportedItems: '#minecraft:enchantable/weapon'
  PrimaryItems:
  - '#minecraft:swords'
  Enchanting:
    Weight: 3
    MinCost: 16
    MaxCost: 38
  Skills:
  - skill{s=NL_ENCHANT_EXECUTIONER_MARK} @target ~onAttack
  - skill{s=NL_ENCHANT_EXECUTIONER_STRIKE} @target ~onAttack

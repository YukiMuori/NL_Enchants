nl:executioner:
  Display: '<aqua>Executioner'
  Description: '<gray>Strikes against weakened targets hit harder — and you can see when they are vulnerable.'
  Rarity: RARE
  MaxLevel: 3
  AnvilCost: 4
  ValidSlots:
  - MAINHAND
  SupportedItems: '#minecraft:enchantable/weapon'
  PrimaryItems:
  - '#minecraft:swords'
  Enchanting:
    Weight: 3
    MinCost: 16
    MaxCost: 38
  Skills:
  - skill{s=NL_ENCHANT_EXECUTIONER_MARK} @self ~onAttack
  - skill{s=NL_ENCHANT_EXECUTIONER_STRIKE} @self ~onAttack

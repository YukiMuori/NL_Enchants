nl:predator:
  Display: '<aqua>Predator'
  Description: '<gray>Strike back harder at the enemy that just hit you.'
  Rarity: RARE
  MaxLevel: 2
  AnvilCost: 4
  ValidSlots:
  - MAINHAND
  SupportedItems: '#minecraft:enchantable/weapon'
  PrimaryItems:
  - '#minecraft:swords'
  Enchanting:
    Weight: 3
    MinCost: 16
    MaxCost: 38
  Skills:
  - skill{s=NL_ENCHANT_PREDATOR_MARK} @self ~onDamaged
  - skill{s=NL_ENCHANT_PREDATOR_STRIKE} @self ~onAttack

# ══════════════════════════════════════════════════════════════════════════════
#  NL_Enchants — HEMORRHAGE  (ID: nl:bleeding, kept for item compatibility)
#  Docs: docs/enchantments/bleeding.md
#
#  Consecutive hits on the same target build wounds:
#    HIT 1 → wound mark I   HIT 2 → wound mark II   HIT 3 → BURST (DoT + end hit)
#  Each stack decays after 4s; the burst clears all marks and restarts.
# ══════════════════════════════════════════════════════════════════════════════

nl:bleeding:
  Display: '<white>Hemorrhage'
  Description: '<gray>Consecutive strikes open wounds that finally burst.'
  Rarity: UNCOMMON
  MaxLevel: 3
  AnvilCost: 2
  ValidSlots:
  - MAINHAND
  SupportedItems: '#minecraft:enchantable/weapon'
  PrimaryItems:
  - '#minecraft:swords'
  Enchanting:
    Weight: 5
    MinCost: 8
    MaxCost: 30
  Skills:
  - skill{s=NL_ENCHANT_BLEEDING_HIT} @target ~onAttack

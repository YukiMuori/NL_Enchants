#  NL_Enchants — combat enchantment (one file per enchant)
#  Docs: docs/enchantments/mark.md   ·   https://wiki.mythiccraft.io/mythicenchants
# ══════════════════════════════════════════════════════════════════════════════

nl:mark:
  Display: '<aqua>Mark'
  Description: '<gray>Your first hit marks a target; keeping the pressure rewarded.'
  Rarity: RARE
  MaxLevel: 1
  AnvilCost: 4
  ValidSlots:
  - MAINHAND
  SupportedItems: '#minecraft:enchantable/weapon'
  PrimaryItems:
  - '#minecraft:swords'
  Enchanting:
    Weight: 3
    MinCost: 16
    MaxCost: 38
  Skills:
  - skill{s=NL_ENCHANT_MARK_APPLY} @self ~onAttack
  - skill{s=NL_ENCHANT_MARK_HIT} @self ~onAttack

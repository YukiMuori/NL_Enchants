# ══════════════════════════════════════════════════════════════════════════════
#  NL_Enchants — mark (one file per enchant)
#  Docs: docs/enchantments/mark.md   ·   https://wiki.mythiccraft.io/mythicenchants
#
#  RELIABILITY RULES (v0.3.0):
#   · dispatch lines mirror official MythicEnchants examples exactly
#   · metaskills use <skill.var.enchant-level> (the documented in-context form)
#   · one condition per line; no comma lists inside conditions
# ══════════════════════════════════════════════════════════════════════════════
nl:mark:
  Display: '<aqua>Mark'
  Description: '<gray>Your first hit marks a target; keeping the pressure rewarded.'
  Rarity: RARE
  MaxLevel: 1
  AnvilCost: 4
  ValidSlots:
  - MAINHAND
  SupportedItems: '#minecraft:enchantable/weapon'
  PrimaryItems:
  - '#minecraft:swords'
  Enchanting:
    Weight: 3
    MinCost: 16
    MaxCost: 38
  Skills:
  - skill{s=NL_ENCHANT_MARK_APPLY} @target ~onAttack
  - skill{s=NL_ENCHANT_MARK_HIT} @target ~onAttack

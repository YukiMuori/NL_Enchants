  - '#minecraft:swords'
  ConflictingEnchants:
  - nl:sluggish
  Enchanting:
    Weight: 3
    MinCost: 16
    MaxCost: 38
  Skills:
  - skill{s=NL_ENCHANT_STAGGERING_PROC} @target ~onAttack

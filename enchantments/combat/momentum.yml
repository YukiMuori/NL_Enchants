nl:momentum:
  Display: '<white>Momentum'
  Description: '<gray>Chained kills keep you fast — taking a hit breaks the flow.'
  Rarity: UNCOMMON
  MaxLevel: 3
  AnvilCost: 2
  ValidSlots:
  - MAINHAND
  SupportedItems: '#minecraft:enchantable/weapon'
  PrimaryItems:
  - '#minecraft:swords'
  Enchanting:
    Weight: 5
    MinCost: 8
    MaxCost: 30
  Skills:
  - skill{s=NL_ENCHANT_MOMENTUM_GAIN} @self ~onKill

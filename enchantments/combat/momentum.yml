#  NL_Enchants — momentum (one file per enchant)
#  Docs: docs/enchantments/momentum.md   ·   https://wiki.mythiccraft.io/mythicenchants
#
#  RELIABILITY RULES (v0.3.0):
#   · dispatch lines mirror official MythicEnchants examples exactly
#   · metaskills use <skill.var.enchant-level> (the documented in-context form)
#   · one condition per line; no comma lists inside conditions
# ══════════════════════════════════════════════════════════════════════════════
nl:momentum:
  Display: '<white>Momentum'
  Description: '<gray>Chained kills keep you fast — taking a hit breaks the flow.'
  Rarity: UNCOMMON
  MaxLevel: 3
  AnvilCost: 2
  ValidSlots:
  - MAINHAND
  SupportedItems: '#minecraft:enchantable/weapon'
  PrimaryItems:
  - '#minecraft:swords'
  Enchanting:
    Weight: 5
    MinCost: 8
    MaxCost: 30
  Skills:
  - skill{s=NL_ENCHANT_MOMENTUM_GAIN} @self ~onKill

# ══════════════════════════════════════════════════════════════════════════════
#  NL_Enchants — COMBO
#  Docs: docs/enchantments/combo.md
#
#  Consecutive hits within 4s build a combo with escalating feedback;
#  the 4th hit is a FINISHER (bonus damage + impact) and resets the chain.
#
#  Pattern: MythicEnchants counter, driven entirely on these DIRECT lines
#  (?counter inline = official pattern; addcounter in direct lines =
#  official Counter usage). The 80t expiry refreshes on every hit.
# ══════════════════════════════════════════════════════════════════════════════

nl:combo:
  Display: '<aqua>Combo'
  Description: '<gray>Keep striking to build a combo — the fourth hit finishes.'
  Rarity: RARE
  MaxLevel: 3
  AnvilCost: 4
  ValidSlots:
  - MAINHAND
  SupportedItems: '#minecraft:enchantable/weapon'
  PrimaryItems:
  - '#minecraft:swords'
  Enchanting:
    Weight: 3
    MinCost: 16
    MaxCost: 38
  Skills:
  - addcounter{key=nl_combo;amt=1;expiry=80t} @self ~onAttack
  - skill{s=NL_VFX_COMBO_1} @target ~onAttack ?counter{key=nl_combo;value=1}
  - skill{s=NL_VFX_COMBO_2} @target ~onAttack ?counter{key=nl_combo;value=2}
  - skill{s=NL_VFX_COMBO_3} @target ~onAttack ?counter{key=nl_combo;value=3}
  - skill{s=NL_ENCHANT_COMBO_FINISH} @target ~onAttack ?counter{key=nl_combo;value=>=4}
  - addcounter{key=nl_combo;amt=-4} @self ~onAttack ?counter{key=nl_combo;value=>=4}

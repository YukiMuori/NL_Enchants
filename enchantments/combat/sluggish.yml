  - '#minecraft:swords'
  ConflictingEnchants:
  - nl:staggering
  Enchanting:
    Weight: 5
    MinCost: 8
    MaxCost: 30
  Skills:
  - skill{s=NL_ENCHANT_SLUGGISH_PROC} @target ~onAttack

nl:nether_affinity:
  Display: '<white>Nether Affinity'
  Description: '<gray>Reduces damage received in the Nether.'
  Rarity: UNCOMMON
  MaxLevel: 3
  AnvilCost: 2
  ValidSlots:
  - HEAD
  - CHEST
  - LEGS
  - FEET
  SupportedItems: '#minecraft:enchantable/armor'
  Enchanting:
    Weight: 5
    MinCost: 8
    MaxCost: 30
  Skills:
  - reducedamage{a=<math:damage*0.15*enchant_level>;cap=0.5} @self ~onDamaged ?world{w=world_nether,nether}

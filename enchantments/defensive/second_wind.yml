nl:second_wind:
  Display: '<aqua>Second Wind'
  Description: '<gray>At the brink, a burst of vigor carries you a little longer.'
  Rarity: RARE
  MaxLevel: 2
  AnvilCost: 4
  ValidSlots:
  - HEAD
  - CHEST
  - LEGS
  - FEET
  SupportedItems: '#minecraft:enchantable/armor'
  ConflictingEnchants:
  - nl:voidbound
  Enchanting:
    Weight: 3
    MinCost: 16
    MaxCost: 38
  Skills:
  - skill{s=NL_ENCHANT_SECONDWIND_CHECK} @self ~onDamaged

nl:reprisal:
  Display: '<white>Reprisal'
  Description: '<gray>Blows against you sometimes bite back at the attacker.'
  Rarity: UNCOMMON
  MaxLevel: 3
  AnvilCost: 2
  ValidSlots:
  - HEAD
  - CHEST
  - LEGS
  - FEET
  SupportedItems: '#minecraft:enchantable/armor'
  ConflictingEnchants:
  - nl:reflection
  Enchanting:
    Weight: 5
    MinCost: 8
    MaxCost: 30
  Skills:
  - skill{s=NL_ENCHANT_REPRISAL_THORN} @self ~onDamaged

nl:rebounding:
  Display: '<white>Rebounding'
  Description: '<gray>Rebounds incoming melee damage back at your attacker.'
  Rarity: RARE
  MaxLevel: 3
  AnvilCost: 4
  ValidSlots:
  - HEAD
  - CHEST
  - LEGS
  - FEET
  SupportedItems: '#minecraft:enchantable/armor'
  Enchanting:
    Weight: 3
    MinCost: 16
    MaxCost: 38
  Skills:
  - reducedamage{a=<math:damage*0.1*enchant_level>;cap=0.3} @self ~onDamaged ?lastdamagecause{c=ENTITY_ATTACK}
  - damage{a=<math:damage*0.2*enchant_level>} @trigger ~onDamaged ?lastdamagecause{c=ENTITY_ATTACK}
  - skill{s=NL_VFX_IMPACT} @trigger ~onDamaged ?lastdamagecause{c=ENTITY_ATTACK} ?chance{c=0.4}

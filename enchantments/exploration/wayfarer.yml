nl:wayfarer:
  Display: '<white>Wayfarer'
  Description: '<gray>Long stretches of honest travel reward you with a moment of vigor.'
  Rarity: UNCOMMON
  MaxLevel: 1
  AnvilCost: 2
  ValidSlots:
  - HEAD
  - CHEST
  - LEGS
  - FEET
  SupportedItems: '#minecraft:enchantable/armor'
  Enchanting:
    Weight: 5
    MinCost: 8
    MaxCost: 30
  Skills:
  - skill{s=NL_ENCHANT_WAYFARER_EQUIP} @self ~onEquip
  - skill{s=NL_ENCHANT_WAYFARER_UNEQUIP} @self ~onUnequip

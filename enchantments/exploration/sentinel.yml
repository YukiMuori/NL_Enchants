# ══════════════════════════════════════════════════════════════════════════════
#  NL_Enchants — SENTINEL (v0.4.0 rework — Neverland design)
#  Docs: docs/enchantments/sentinel.md
#
#  When you are hit and hostiles lurk within 10 blocks, ALL of them are
#  revealed with a glowing outline for 5 seconds. 5s internal cooldown.
#
#  RUNTIME-VERIFY (flagged): the @MobsInRadius types filter and the plain
#  glow aura component are documented-but-unproven in this context.
#  Fallback design (documented in the spec) uses the verified mobsinradius
#  condition with a self-centered pulse if the targeter filter misbehaves.
# ══════════════════════════════════════════════════════════════════════════════

nl:sentinel:
  Display: '<aqua>Sentinel'
  Description: '<gray>Struck near the dark? Every hostile nearby is revealed, glowing.'
  Rarity: RARE
  MaxLevel: 1
  AnvilCost: 4
  ValidSlots:
  - HEAD
  SupportedItems: '#minecraft:enchantable/armor'
  Enchanting:
    Weight: 3
    MinCost: 16
    MaxCost: 38
  Skills:
  - skill{s=NL_ENCHANT_SENTINEL_MARK} @self ~onDamaged

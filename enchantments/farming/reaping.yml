nl:reaping:
  Display: '<aqua>Reaping'
  Description: '<gray>Harvesting sometimes sweeps the neighboring crops in one go.'
  Rarity: RARE
  MaxLevel: 1
  AnvilCost: 4
  ValidSlots:
  - MAINHAND
  SupportedItems: '#minecraft:enchantable/mining'
  PrimaryItems:
  - minecraft:wooden_hoe
  - minecraft:stone_hoe
  - minecraft:iron_hoe
  - minecraft:golden_hoe
  - minecraft:diamond_hoe
  - minecraft:netherite_hoe
  Enchanting:
    Weight: 3
    MinCost: 16
    MaxCost: 38
  Skills:
  - skill{s=NL_ENCHANT_REAPING_SWEEP} @self ~onBlockBreak ?triggerblocktype{t=WHEAT}
  - skill{s=NL_ENCHANT_REAPING_SWEEP} @self ~onBlockBreak ?triggerblocktype{t=CARROTS}
  - skill{s=NL_ENCHANT_REAPING_SWEEP} @self ~onBlockBreak ?triggerblocktype{t=POTATOES}
  - skill{s=NL_ENCHANT_REAPING_SWEEP} @self ~onBlockBreak ?triggerblocktype{t=BEETROOTS}

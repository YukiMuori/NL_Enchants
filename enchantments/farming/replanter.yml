# ══════════════════════════════════════════════════════════════════════════════
#  NL_Enchants — REPLANTER (v0.4.0 rewrite)
#  Docs: docs/enchantments/replanter.md
#
#  The direct setblock lines did not fire in the field. Rewritten on the
#  officially documented OnBlockBreak aura component (blocktypes filter +
#  @targetlocation = the broken block): listeners installed while the hoe
#  is held, removed on unequip. Re-equip after relog (listener architecture).
# ══════════════════════════════════════════════════════════════════════════════

nl:replanter:
  Display: '<white>Replanter'
  Description: '<gray>Harvested crops are immediately replanted.'
  Rarity: COMMON
  MaxLevel: 1
  AnvilCost: 1
  ValidSlots:
  - MAINHAND
  SupportedItems: '#minecraft:enchantable/mining'
  PrimaryItems:
  - minecraft:wooden_hoe
  - minecraft:stone_hoe
  - minecraft:iron_hoe
  - minecraft:golden_hoe
  - minecraft:diamond_hoe
  - minecraft:netherite_hoe
  Enchanting:
    Weight: 6
    MinCost: 4
    MaxCost: 24
  Skills:
  - skill{s=NL_ENCHANT_REPLANTER_EQUIP} @self ~onEquip
  - skill{s=NL_ENCHANT_REPLANTER_UNEQUIP} @self ~onUnequip

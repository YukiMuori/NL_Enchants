# ══════════════════════════════════════════════════════════════════════════════
#  NL_Enchants — replanter (one file per enchant)
#  Docs: docs/enchantments/replanter.md   ·   https://wiki.mythiccraft.io/mythicenchants
#
#  RELIABILITY RULES (v0.3.0):
#   · dispatch lines mirror official MythicEnchants examples exactly
#   · direct enchant lines may use <math:...> (Enchantment-Config form)
#   · one condition per line; no comma lists inside conditions
# ══════════════════════════════════════════════════════════════════════════════
#  Unchanged: direct setblock lines with single-material inline gates —
#  verified pattern, reported working.
nl:replanter:
  Display: '<white>Replanter'
  Description: '<gray>Harvested crops are immediately replanted.'
  Rarity: COMMON
  MaxLevel: 1
  AnvilCost: 1
  ValidSlots:
  - MAINHAND
  SupportedItems: '#minecraft:enchantable/mining'
  PrimaryItems:
  - minecraft:wooden_hoe
  - minecraft:stone_hoe
  - minecraft:iron_hoe
  - minecraft:golden_hoe
  - minecraft:diamond_hoe
  - minecraft:netherite_hoe
  Enchanting:
    Weight: 6
    MinCost: 4
    MaxCost: 24
  Skills:
  - setblock{m=WHEAT} @origin ~onBlockBreak ?triggerblocktype{t=WHEAT}
  - setblock{m=CARROTS} @origin ~onBlockBreak ?triggerblocktype{t=CARROTS}
  - setblock{m=POTATOES} @origin ~onBlockBreak ?triggerblocktype{t=POTATOES}
  - setblock{m=BEETROOTS} @origin ~onBlockBreak ?triggerblocktype{t=BEETROOTS}
  - skill{s=NL_VFX_REPLANTER_PUFF} @origin ~onBlockBreak ?triggerblocktype{t=WHEAT}
  - skill{s=NL_VFX_REPLANTER_PUFF} @origin ~onBlockBreak ?triggerblocktype{t=CARROTS}
  - skill{s=NL_VFX_REPLANTER_PUFF} @origin ~onBlockBreak ?triggerblocktype{t=POTATOES}
  - skill{s=NL_VFX_REPLANTER_PUFF} @origin ~onBlockBreak ?triggerblocktype{t=BEETROOTS}

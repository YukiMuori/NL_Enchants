# ══════════════════════════════════════════════════════════════════════════════
#  NL_Enchants — BLOOM  (ID: nl:green_thumb, kept for item compatibility)
#  Docs: docs/enchantments/green_thumb.md
#
#  Harvesting a crop may release an expanding natural wave: three growth
#  rings (r=2 → 3 → 4) pulse outward around you, encouraging every plant
#  they touch. Chance scales with level (5/10/15%).
# ══════════════════════════════════════════════════════════════════════════════

nl:green_thumb:
  Display: '<white>Bloom'
  Description: '<gray>Harvesting may send a wave of growth rippling outward.'
  Rarity: COMMON
  MaxLevel: 3
  AnvilCost: 1
  ValidSlots:
  - MAINHAND
  SupportedItems: '#minecraft:enchantable/mining'
  PrimaryItems:
  - minecraft:wooden_hoe
  - minecraft:stone_hoe
  - minecraft:iron_hoe
  - minecraft:golden_hoe
  - minecraft:diamond_hoe
  - minecraft:netherite_hoe
  Enchanting:
    Weight: 6
    MinCost: 4
    MaxCost: 24
  Skills:
  - skill{s=NL_ENCHANT_BLOOM_WAVE} @self ~onBlockBreak ?triggerblocktype{t=WHEAT}
  - skill{s=NL_ENCHANT_BLOOM_WAVE} @self ~onBlockBreak ?triggerblocktype{t=CARROTS}
  - skill{s=NL_ENCHANT_BLOOM_WAVE} @self ~onBlockBreak ?triggerblocktype{t=POTATOES}
  - skill{s=NL_ENCHANT_BLOOM_WAVE} @self ~onBlockBreak ?triggerblocktype{t=BEETROOTS}
  - skill{s=NL_ENCHANT_BLOOM_WAVE} @self ~onBlockBreak ?triggerblocktype{t=MELON}
  - skill{s=NL_ENCHANT_BLOOM_WAVE} @self ~onBlockBreak ?triggerblocktype{t=PUMPKIN}

nl:recall:
  Display: '<white>Recall'
  Description: '<gray>Arrows sometimes return to your quiver after landing.'
  Rarity: UNCOMMON
  MaxLevel: 1
  AnvilCost: 2
  ValidSlots:
  - MAINHAND
  SupportedItems: '#minecraft:enchantable/bow'
  Enchanting:
    Weight: 5
    MinCost: 8
    MaxCost: 30
  Skills:
  - skill{s=NL_ENCHANT_RECALL_MISS} @self ~onBowMiss
  - skill{s=NL_ENCHANT_RECALL_HIT} @self ~onBowHit

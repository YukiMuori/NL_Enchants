# ══════════════════════════════════════════════════════════════════════════════
#  NL_Enchants — hawkeye (one file per enchant)
#  Docs: docs/enchantments/hawkeye.md   ·   https://wiki.mythiccraft.io/mythicenchants
#
#  RELIABILITY RULES (v0.3.0):
#   · dispatch lines mirror official MythicEnchants examples exactly
#   · direct enchant lines may use <math:...> (Enchantment-Config form)
#   · one condition per line; no comma lists inside conditions
# ══════════════════════════════════════════════════════════════════════════════
#  REDESIGNED v0.3.0 on fully-documented mechanics only:
#  arrowbuff on ~onShoot is the official Power example; bowtension is the
#  official draw-tension condition; inline ?conditions on enchant lines are
#  the official pattern. The old draw-focus listeners were removed.
nl:hawkeye:
  Display: '<aqua>Hawkeye'
  Description: '<gray>Fully-drawn shots fly harder and truer.'
  Rarity: RARE
  MaxLevel: 2
  AnvilCost: 4
  ValidSlots:
  - MAINHAND
  SupportedItems: '#minecraft:enchantable/bow'
  Enchanting:
    Weight: 3
    MinCost: 16
    MaxCost: 38
  Skills:
  - arrowbuff{a=<math:enchant_level*0.75>} @self ~onShoot ?bowtension{value=>0.9}
  - skill{s=NL_VFX_HAWKEYE_RELEASE} @self ~onShoot ?bowtension{value=>0.9}

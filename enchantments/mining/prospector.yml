# ══════════════════════════════════════════════════════════════════════════════
#  NL_Enchants — prospector (one file per enchant)
#  Docs: docs/enchantments/prospector.md
#
#  v0.3.2 — field fixes: enchantable/mining + pickaxe PrimaryItems;
#  material-list triggerblocktype gate (tags rejected by the filter).
# ══════════════════════════════════════════════════════════════════════════════

nl:prospector:
  Display: '<aqua>Prospector'
  Description: '<gray>Mining ore sends out a pulse — diamonds nearby make it sing.'
  Rarity: RARE
  MaxLevel: 1
  AnvilCost: 4
  ValidSlots:
  - MAINHAND
  SupportedItems: '#minecraft:enchantable/mining'
  PrimaryItems:
  - minecraft:wooden_pickaxe
  - minecraft:stone_pickaxe
  - minecraft:iron_pickaxe
  - minecraft:golden_pickaxe
  - minecraft:diamond_pickaxe
  - minecraft:netherite_pickaxe
  Enchanting:
    Weight: 3
    MinCost: 16
    MaxCost: 38
  Skills:
  - skill{s=NL_ENCHANT_PROSPECTOR_PING} @self ~onBlockBreak ?triggerblocktype{t=COAL_ORE,DEEPSLATE_COAL_ORE,IRON_ORE,DEEPSLATE_IRON_ORE,COPPER_ORE,DEEPSLATE_COPPER_ORE,GOLD_ORE,DEEPSLATE_GOLD_ORE,REDSTONE_ORE,DEEPSLATE_REDSTONE_ORE,LAPIS_ORE,DEEPSLATE_LAPIS_ORE,DIAMOND_ORE,DEEPSLATE_DIAMOND_ORE,EMERALD_ORE,DEEPSLATE_EMERALD_ORE,NETHER_GOLD_ORE,NETHER_QUARTZ_ORE}

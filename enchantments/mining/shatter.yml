# ══════════════════════════════════════════════════════════════════════════════
#  NL_Enchants — shatter (one file per enchant)
#  Docs: docs/enchantments/shatter.md   ·   https://wiki.mythiccraft.io/mythicenchants
#
#  RELIABILITY RULES (v0.3.0):
#   · dispatch lines mirror official MythicEnchants examples exactly
#   · direct enchant lines may use <math:...> (Enchantment-Config form)
#   · one condition per line; no comma lists inside conditions
# ══════════════════════════════════════════════════════════════════════════════
#  One gate line per vanilla block tag / material (verified single-target
#  form). veinminer itself matches the full material list (unknown entries
#  are safely skipped per its documentation).
nl:shatter:
  Display: '<aqua>Shatter'
  Description: '<gray>Your picks sometimes crack the neighboring blocks of the same family.'
  Rarity: RARE
  MaxLevel: 3
  AnvilCost: 4
  ValidSlots:
  - MAINHAND
  SupportedItems: '#minecraft:enchantable/pickaxe'
  Enchanting:
    Weight: 3
    MinCost: 16
    MaxCost: 38
  Skills:
  - skill{s=NL_ENCHANT_SHATTER_STONE} @self ~onBlockBreak ?triggerblocktype{t=#minecraft:base_stone_overworld}
  - skill{s=NL_ENCHANT_SHATTER_STONE} @self ~onBlockBreak ?triggerblocktype{t=#minecraft:base_stone_nether}
  - skill{s=NL_ENCHANT_SHATTER_STONE} @self ~onBlockBreak ?triggerblocktype{t=COBBLESTONE}
  - skill{s=NL_ENCHANT_SHATTER_STONE} @self ~onBlockBreak ?triggerblocktype{t=COBBLED_DEEPSLATE}
  - skill{s=NL_ENCHANT_SHATTER_ORE} @self ~onBlockBreak ?triggerblocktype{t=#minecraft:coal_ores}
  - skill{s=NL_ENCHANT_SHATTER_ORE} @self ~onBlockBreak ?triggerblocktype{t=#minecraft:iron_ores}
  - skill{s=NL_ENCHANT_SHATTER_ORE} @self ~onBlockBreak ?triggerblocktype{t=#minecraft:copper_ores}
  - skill{s=NL_ENCHANT_SHATTER_ORE} @self ~onBlockBreak ?triggerblocktype{t=#minecraft:gold_ores}
  - skill{s=NL_ENCHANT_SHATTER_ORE} @self ~onBlockBreak ?triggerblocktype{t=#minecraft:redstone_ores}
  - skill{s=NL_ENCHANT_SHATTER_ORE} @self ~onBlockBreak ?triggerblocktype{t=#minecraft:lapis_ores}
  - skill{s=NL_ENCHANT_SHATTER_ORE} @self ~onBlockBreak ?triggerblocktype{t=#minecraft:diamond_ores}
  - skill{s=NL_ENCHANT_SHATTER_ORE} @self ~onBlockBreak ?triggerblocktype{t=#minecraft:emerald_ores}

# ══════════════════════════════════════════════════════════════════════════════
#  NL_Enchants — shatter (one file per enchant)
#  Docs: docs/enchantments/shatter.md
#
#  v0.3.2 — field fixes: (a) SupportedItems uses #minecraft:enchantable/mining
#  (runtime-provided valid tag; pickaxe/hoe tags do not exist) narrowed by
#  PrimaryItems to pickaxes; (b) triggerblocktype gates use MATERIAL LISTS —
#  '#' block tags are rejected by the TriggerBlockTypeFilter (field-verified).
# ══════════════════════════════════════════════════════════════════════════════

nl:shatter:
  Display: '<aqua>Earthshatter'
  Description: '<gray>Your picks send cracks rippling through the same stone family.'
  Rarity: RARE
  MaxLevel: 3
  AnvilCost: 4
  ValidSlots:
  - MAINHAND
  SupportedItems: '#minecraft:enchantable/mining'
  PrimaryItems:
  - minecraft:wooden_pickaxe
  - minecraft:stone_pickaxe
  - minecraft:iron_pickaxe
  - minecraft:golden_pickaxe
  - minecraft:diamond_pickaxe
  - minecraft:netherite_pickaxe
  Enchanting:
    Weight: 3
    MinCost: 16
    MaxCost: 38
  Skills:
  - skill{s=NL_ENCHANT_SHATTER_STONE} @self ~onBlockBreak ?triggerblocktype{t=STONE,COBBLESTONE,DEEPSLATE,COBBLED_DEEPSLATE,TUFF,GRANITE,DIORITE,ANDESITE,NETHERRACK,BLACKSTONE}
  - skill{s=NL_ENCHANT_SHATTER_ORE} @self ~onBlockBreak ?triggerblocktype{t=COAL_ORE,DEEPSLATE_COAL_ORE,IRON_ORE,DEEPSLATE_IRON_ORE,COPPER_ORE,DEEPSLATE_COPPER_ORE,GOLD_ORE,DEEPSLATE_GOLD_ORE,REDSTONE_ORE,DEEPSLATE_REDSTONE_ORE,LAPIS_ORE,DEEPSLATE_LAPIS_ORE,DIAMOND_ORE,DEEPSLATE_DIAMOND_ORE,EMERALD_ORE,DEEPSLATE_EMERALD_ORE,NETHER_GOLD_ORE,NETHER_QUARTZ_ORE}

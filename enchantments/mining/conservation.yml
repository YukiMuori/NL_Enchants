#  NL_Enchants — conservation (one file per enchant)
#  Docs: docs/enchantments/conservation.md   ·   https://wiki.mythiccraft.io/mythicenchants
#
#  RELIABILITY RULES (v0.3.0):
#   · dispatch lines mirror official MythicEnchants examples exactly
#   · direct enchant lines may use <math:...> (Enchantment-Config form)
#   · one condition per line; no comma lists inside conditions
# ══════════════════════════════════════════════════════════════════════════════
#  Direct line (Enchantment-Config math form). unbreaking's chance is
#  PER LEVEL per its documentation: at level 1 ~15%/level, at 2 ~20%/level.
nl:conservation:
  Display: '<white>Conservation'
  Description: '<gray>Your tools sometimes ignore wear.'
  Rarity: UNCOMMON
  MaxLevel: 2
  AnvilCost: 2
  ValidSlots:
  - MAINHAND
  SupportedItems: '#minecraft:enchantable/durability'
  Enchanting:
    Weight: 5
    MinCost: 8
    MaxCost: 30
  Skills:
  - unbreaking{c=<math:0.1+0.05*enchant_level>} @self ~onItem_damage

# ══════════════════════════════════════════════════════════════════════════════
#  NL_Enchants — resonance skills. Pure MythicMobs mechanics ONLY.
#  R8: no MythicEnchants conditions here — slot checks live in the
#  enchantment's dispatch lines.
# ══════════════════════════════════════════════════════════════════════════════

NL_RESONANCE_FULL:
  Cooldown: 20
  Skills:
  - potion{type=REGENERATION;d=160;l=1;hasParticles=false} @self
  - skill{s=NL_VFX_RESONANCE_PULSE4} @self

NL_RESONANCE_ANY:
  Cooldown: 20
  Skills:
  - potion{type=REGENERATION;d=60;l=0;hasParticles=false} @self
  # skip the small VFX when the full-set tier just fired (stronger regen on)
  - skill{s=NL_VFX_RESONANCE_PULSE1} @self ?!haspotioneffect{type=REGENERATION;level=>0}

# ══════════════════════════════════════════════════════════════════════════════
#  NL_Enchants — voidbound skills. Gameplay logic only.
#  The lethality gate lives in the enchantment's dispatch line as an inline
#  MythicEnchants condition (R8: never in this file).
#  reducedamage with a=1000 + cap=1 fully negates the killing event without
#  needing any damage variable inside a metaskill.
# ══════════════════════════════════════════════════════════════════════════════

NL_ENCHANT_VOIDBOUND_SAVE:
  Cooldown: 600
  Skills:
  - reducedamage{a=1000;cap=1} @self
  - potion{type=ABSORPTION;d=200;l=1;hasParticles=false} @self
  - skill{s=NL_VFX_VOIDBOUND_IMPLODE} @self

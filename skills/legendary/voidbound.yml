# ══════════════════════════════════════════════════════════════════════════════
#  NL_Enchants — voidbound skills. Gameplay logic only.
#  lethalcheck runs inline on the ~onDamaged line (official pattern).
#  cap=1 lets the reduction fully negate the lethal event.
# ══════════════════════════════════════════════════════════════════════════════

NL_ENCHANT_VOIDBOUND_SAVE:
  Cooldown: 600
  Skills:
  - reducedamage{a=<math:damage+10>;cap=1} @self
  - potion{type=ABSORPTION;d=200;l=1;hasParticles=false} @self
  - skill{s=NL_VFX_VOIDBOUND_IMPLODE} @self

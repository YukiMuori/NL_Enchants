# ══════════════════════════════════════════════════════════════════════════════
#  NL_Enchants — voidbound skills. Gameplay logic only.
#  lethalcheck gates the dispatch line (official inline pattern).
#  reducedamage with a=1000 + cap=1 fully negates the lethal event without
#  needing the <math:damage> variable inside a metaskill.
# ══════════════════════════════════════════════════════════════════════════════

NL_ENCHANT_VOIDBOUND_SAVE:
  Cooldown: 600
  Skills:
  - reducedamage{a=1000;cap=1} @self
  - potion{type=ABSORPTION;d=200;l=1;hasParticles=false} @self
  - skill{s=NL_VFX_VOIDBOUND_IMPLODE} @self

NL_ENCHANT_PROSPECTOR_PING:
  Cooldown: 6
  Skills:
  - skill{s=NL_VFX_PROSPECTOR_STRONG} @self ?blocktypeinradius{t=DIAMOND_ORE;a=1to999;r=8}
  - skill{s=NL_VFX_PROSPECTOR_SOFT} @self ?!blocktypeinradius{t=DIAMOND_ORE;a=1to999;r=8}

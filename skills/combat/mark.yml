# ══════════════════════════════════════════════════════════════════════════════
#  NL_Enchants — combat skills for one enchant. Gameplay logic only.
# ══════════════════════════════════════════════════════════════════════════════

NL_ENCHANT_MARK_APPLY:
  TargetConditions:
  - hasaura{aura=nl_mark_state} false
  Skills:
  - aura{auraname=nl_mark_state;d=160;i=20;maxStacks=1;overwriteAll=true} @trigger
  - skill{s=NL_VFX_MARK_APPLY} @trigger
NL_ENCHANT_MARK_HIT:
  TargetConditions:
  - hasaura{aura=nl_mark_state} true
  Skills:
  - damage{a=1.5} @trigger
  - aura{auraname=nl_mark_state;d=160;i=20;maxStacks=1;overwriteAll=true} @trigger
  - skill{s=NL_VFX_MARK_PULSE} @trigger

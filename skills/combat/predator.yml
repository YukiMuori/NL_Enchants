# ══════════════════════════════════════════════════════════════════════════════
#  NL_Enchants — combat skills. Gameplay logic only.
#  Variable form inside metaskills: <skill.var.enchant-level> (official docs).
#  Mechanics without a targeter INHERIT the dispatch targeter's targets.
# ══════════════════════════════════════════════════════════════════════════════

NL_ENCHANT_PREDATOR_MARK:
  # @trigger on ~onDamaged = the attacker (official pattern).
  Skills:
  - aura{auraname=nl_predator_stalk;d=100;i=20;maxStacks=1;overwriteAll=true} @trigger
NL_ENCHANT_PREDATOR_STRIKE:
  TargetConditions:
  - hasaura{aura=nl_predator_stalk} true
  Skills:
  - damage{a=<skill.var.enchant-level>}
  - auraremove{aura=nl_predator_stalk}
  - skill{s=NL_VFX_PREDATOR_STRIKE}

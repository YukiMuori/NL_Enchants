NL_ENCHANT_SLUGGISH_PROC:
  # chance form per official ME quick-start: c=<skill.var.enchant-level>*X
  Conditions:
  - chance{c=<skill.var.enchant-level>*0.05}
  Skills:
  - potion{type=SLOW;d=50;l=0;hasParticles=false}
  - skill{s=NL_VFX_SLUGGISH_HIT}

# ══════════════════════════════════════════════════════════════════════════════
#  NL_Enchants — combat skills. Gameplay logic only.
#  Variable form inside metaskills: <skill.var.enchant-level> (official docs).
#  Mechanics without a targeter INHERIT the dispatch targeter's targets.
# ══════════════════════════════════════════════════════════════════════════════

NL_ENCHANT_EXECUTIONER_MARK:
  Cooldown: 3
  TargetConditions:
  - healthpercent{p=<30%}
  Skills:
  - particles{p=angry_villager;a=1;hs=0.1;vs=0.1;y=2.3} @targetLocation
  - sound{s=entity.villager.no;v=0.4;p=1.6} @targetLocation
NL_ENCHANT_EXECUTIONER_STRIKE:
  TargetConditions:
  - healthpercent{p=<30%}
  Skills:
  - damage{a=<skill.var.enchant-level>}
  - skill{s=NL_VFX_EXECUTIONER_STRIKE}

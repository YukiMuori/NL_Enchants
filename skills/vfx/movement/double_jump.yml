# ══════════════════════════════════════════════════════════════════════════════
#  NL_Enchants — Movement VFX
#
#  VFX skills are pure presentation: particles and sounds only.
#  They must NEVER contain gameplay logic, so effects can be retuned
#  (or silenced) independently of enchantment behavior.
#
#  Neverland visual identity: subtle, airy, readable.
#  Common-tier feedback stays quiet; only activation moments sparkle.
#
#  Enchantment: nl:double_jump
#
#  Mechanic references (verified):
#    https://wiki.mythiccraft.io/mythicmobs/skills/mechanics/particle
#    https://wiki.mythiccraft.io/mythicmobs/skills/mechanics/sound
# ══════════════════════════════════════════════════════════════════════════════

# Second-jump activation: a soft puff under the feet plus a few rising
# motes, with a light "airy flap + distant chime" combo.
# Budget: 22 particles, 2 sounds — fires only when the enchant activates.
NL_VFX_DOUBLEJUMP_BURST:
  Skills:
  - particles{p=cloud;a=12;hs=0.35;vs=0.1;y=-0.3;s=0.05} @self
  - particles{p=end_rod;a=10;hs=0.45;vs=0.2;y=0.15;s=0.09} @self
  - sound{s=entity.ender_dragon.flap;v=0.7;p=1.4} @self
  - sound{s=entity.experience_orb.pickup;v=0.4;p=0.7} @self

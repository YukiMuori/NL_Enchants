# ══════════════════════════════════════════════════════════════════════════════
#  NL_Enchants — sentinel skills. Pure MythicMobs only (R8).
#  Gate: hostiles within 10 blocks (verified multi-type condition).
#  Mark: glow-component aura pinned on each nearby hostile for 5s.
# ══════════════════════════════════════════════════════════════════════════════

NL_ENCHANT_SENTINEL_MARK:
  Cooldown: 5
  Conditions:
  - mobsinradius{types=ZOMBIE,SKELETON,SPIDER,CAVE_SPIDER,CREEPER,DROWNED,HUSK,STRAY,PILLAGER,VEX,VINDICATOR,WITCH,ENDERMAN,PIGLIN,ZOMBIFIED_PIGLIN,WITHER_SKELETON,BLAZE,PHANTOM,SILVERFISH;amount=1to999;radius=10}
  Skills:
  - aura{auraname=nl_sentinel_glow;d=100;i=20;maxStacks=1;overwriteAll=true;components=[  - glow ]} @MobsInRadius{r=10;limit=12;types=ZOMBIE,SKELETON,SPIDER,CAVE_SPIDER,CREEPER,DROWNED,HUSK,STRAY,PILLAGER,VEX,VINDICATOR,WITCH,ENDERMAN,PIGLIN,ZOMBIFIED_PIGLIN,WITHER_SKELETON,BLAZE,PHANTOM,SILVERFISH}
  - sound{s=block.amethyst_block.chime;v=0.5;p=0.5} @self

# ══════════════════════════════════════════════════════════════════════════════
#  NL_Enchants — replanter skills. Pure MythicMobs only (R8).
#  One OnBlockBreak listener per crop (blocktypes filter, documented);
#  @targetlocation is the broken block (official example semantics).
# ══════════════════════════════════════════════════════════════════════════════

NL_ENCHANT_REPLANTER_EQUIP:
  Skills:
  - aura{auraname=nl_replanter_wheat;d=1728000;i=20;overwriteAll=true;CancelOnDeath=false;components=[  - onblockbreak{bt=WHEAT;oB=NL_ENCHANT_REPLANTER_SET_WHEAT} ]} @self
  - aura{auraname=nl_replanter_carrots;d=1728000;i=20;overwriteAll=true;CancelOnDeath=false;components=[  - onblockbreak{bt=CARROTS;oB=NL_ENCHANT_REPLANTER_SET_CARROTS} ]} @self
  - aura{auraname=nl_replanter_potatoes;d=1728000;i=20;overwriteAll=true;CancelOnDeath=false;components=[  - onblockbreak{bt=POTATOES;oB=NL_ENCHANT_REPLANTER_SET_POTATOES} ]} @self
  - aura{auraname=nl_replanter_beetroots;d=1728000;i=20;overwriteAll=true;CancelOnDeath=false;components=[  - onblockbreak{bt=BEETROOTS;oB=NL_ENCHANT_REPLANTER_SET_BEETROOTS} ]} @self

NL_ENCHANT_REPLANTER_UNEQUIP:
  Skills:
  - auraremove{aura=nl_replanter_wheat} @self
  - auraremove{aura=nl_replanter_carrots} @self
  - auraremove{aura=nl_replanter_potatoes} @self
  - auraremove{aura=nl_replanter_beetroots} @self

NL_ENCHANT_REPLANTER_SET_WHEAT:
  Skills:
  - setblock{m=WHEAT} @targetlocation
  - particles{p=composter;a=3;hs=0.2;vs=0.2;y=0.4} @targetlocation

NL_ENCHANT_REPLANTER_SET_CARROTS:
  Skills:
  - setblock{m=CARROTS} @targetlocation
  - particles{p=composter;a=3;hs=0.2;vs=0.2;y=0.4} @targetlocation

NL_ENCHANT_REPLANTER_SET_POTATOES:
  Skills:
  - setblock{m=POTATOES} @targetlocation
  - particles{p=composter;a=3;hs=0.2;vs=0.2;y=0.4} @targetlocation

NL_ENCHANT_REPLANTER_SET_BEETROOTS:
  Skills:
  - setblock{m=BEETROOTS} @targetlocation
  - particles{p=composter;a=3;hs=0.2;vs=0.2;y=0.4} @targetlocation

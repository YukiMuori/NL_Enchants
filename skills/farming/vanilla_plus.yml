NL_REPLENISH_INSTALL:
  CancelIfNoTargets: false
  Skills:
  - aura{auraname=nl_replenish_wheat;d=1728000;i=20;overwriteAll=true;CancelOnDeath=false;components=[  - onblockbreak{bt=WHEAT;oB=NL_REPLENISH_WHEAT} ]} @self
  - aura{auraname=nl_replenish_carrots;d=1728000;i=20;overwriteAll=true;CancelOnDeath=false;components=[  - onblockbreak{bt=CARROTS;oB=NL_REPLENISH_CARROTS} ]} @self
  - aura{auraname=nl_replenish_potatoes;d=1728000;i=20;overwriteAll=true;CancelOnDeath=false;components=[  - onblockbreak{bt=POTATOES;oB=NL_REPLENISH_POTATOES} ]} @self
  - aura{auraname=nl_replenish_beetroots;d=1728000;i=20;overwriteAll=true;CancelOnDeath=false;components=[  - onblockbreak{bt=BEETROOTS;oB=NL_REPLENISH_BEETROOTS} ]} @self

NL_REPLENISH_REMOVE:
  Skills:
  - auraremove{aura=nl_replenish_wheat} @self
  - auraremove{aura=nl_replenish_carrots} @self
  - auraremove{aura=nl_replenish_potatoes} @self
  - auraremove{aura=nl_replenish_beetroots} @self

NL_REPLENISH_WHEAT:
  Skills:
  - setblock{m=WHEAT} @targetlocation
  - particles{p=composter;a=3;hs=0.2;vs=0.2;y=0.4} @targetlocation


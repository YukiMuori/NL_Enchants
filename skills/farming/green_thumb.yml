# ══════════════════════════════════════════════════════════════════════════════
#  NL_Enchants — green thumb skills. Gameplay logic only.
#  BlocksInRadius around the inherited target (the player); bonemeal on
#  grass blocks grows flowers — a fitting vanilla-style burst.
# ══════════════════════════════════════════════════════════════════════════════

NL_ENCHANT_GREENTHUMB_BURST:
  Conditions:
  - chance{c=<skill.var.enchant-level>*0.05}
  Skills:
  - bonemeal @BlocksInRadius{r=2;ry=1;noair=true}
  - skill{s=NL_VFX_GREENTHUMB_SPARKLE} @self

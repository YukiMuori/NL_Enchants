# ══════════════════════════════════════════════════════════════════════════════
#  NL_Enchants — movement skills for one enchant. Gameplay logic only.
# ══════════════════════════════════════════════════════════════════════════════

NL_ENCHANT_CLIMBER_EQUIP:
  # Two listener auras, same verified pattern as nl:double_jump.
  # d=1728000 (24h) — refreshed on re-equip; CancelOnQuit (default) cleans up.
  Skills:
  - aura{auraname=nl_climber_sprint;d=1728000;i=1;overwriteAll=true;CancelOnDeath=false;components=[  - oninput{oi=NL_ENCHANT_CLIMBER_CLIMB;requiresprint=true} ]} @self
  - aura{auraname=nl_climber_jump;d=1728000;i=1;overwriteAll=true;CancelOnDeath=false;components=[  - oninput{oi=NL_ENCHANT_CLIMBER_LEAP;requirejump=true} ]} @self
NL_ENCHANT_CLIMBER_UNEQUIP:
  Skills:
  - auraremove{aura=nl_climber_sprint} @self
  - auraremove{aura=nl_climber_jump} @self
NL_ENCHANT_CLIMBER_CLIMB:
  Conditions:
  - isclimbing
  Skills:
  - velocity{m=ADD;x=0;y=0.1;z=0} @self
  - skill{s=NL_VFX_CLIMBER_GRIP} @self ?chance{c=0.2}
NL_ENCHANT_CLIMBER_LEAP:
  Conditions:
  - isclimbing
  Skills:
  - velocity{m=ADD;x=0;y=0.42;z=0} @self
  - sound{s=entity.arrow.shoot;v=0.4;p=1.5} @self

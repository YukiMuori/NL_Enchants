# ══════════════════════════════════════════════════════════════════════════════
#  NL_Enchants — winged leap skills. Pure MythicMobs only (R8).
#  Charge auras c1..c5 ARE the remaining-jump tokens: self-expiring (6s),
#  refreshed on every ground jump, consumed one per input.
#  Delayed/leap skills use constants only (R1).
# ══════════════════════════════════════════════════════════════════════════════

NL_ENCHANT_WINGED_EQUIP_L1:
  Skills:
  - onJump{oj=NL_ENCHANT_WINGED_ARM_1;auraname=nl_winged_arm;d=1728000;i=20;overwriteAll=true;CancelOnDeath=false} @self
  - aura{auraname=nl_winged_input;d=1728000;i=1;overwriteAll=true;CancelOnDeath=false;components=[  - oninput{oi=NL_ENCHANT_WINGED_TRY;requirejump=true} ]} @self

NL_ENCHANT_WINGED_EQUIP_L2:
  Skills:
  - onJump{oj=NL_ENCHANT_WINGED_ARM_2;auraname=nl_winged_arm;d=1728000;i=20;overwriteAll=true;CancelOnDeath=false} @self
  - aura{auraname=nl_winged_input;d=1728000;i=1;overwriteAll=true;CancelOnDeath=false;components=[  - oninput{oi=NL_ENCHANT_WINGED_TRY;requirejump=true} ]} @self

NL_ENCHANT_WINGED_EQUIP_L3:
  Skills:
  - onJump{oj=NL_ENCHANT_WINGED_ARM_5;auraname=nl_winged_arm;d=1728000;i=20;overwriteAll=true;CancelOnDeath=false} @self
  - aura{auraname=nl_winged_input;d=1728000;i=1;overwriteAll=true;CancelOnDeath=false;components=[  - oninput{oi=NL_ENCHANT_WINGED_TRY;requirejump=true} ]} @self

NL_ENCHANT_WINGED_UNEQUIP:
  Skills:
  - auraremove{aura=nl_winged_arm} @self
  - auraremove{aura=nl_winged_input} @self
  - auraremove{aura=nl_winged_c1} @self
  - auraremove{aura=nl_winged_c2} @self
  - auraremove{aura=nl_winged_c3} @self
  - auraremove{aura=nl_winged_c4} @self
  - auraremove{aura=nl_winged_c5} @self

NL_ENCHANT_WINGED_ARM_1:
  Skills:
  - aura{auraname=nl_winged_c1;d=120;i=20;maxStacks=1;overwriteAll=true;CancelOnDeath=false} @self

NL_ENCHANT_WINGED_ARM_2:
  Skills:
  - aura{auraname=nl_winged_c1;d=120;i=20;maxStacks=1;overwriteAll=true;CancelOnDeath=false} @self
  - aura{auraname=nl_winged_c2;d=120;i=20;maxStacks=1;overwriteAll=true;CancelOnDeath=false} @self

NL_ENCHANT_WINGED_ARM_5:
  Skills:
  - aura{auraname=nl_winged_c1;d=120;i=20;maxStacks=1;overwriteAll=true;CancelOnDeath=false} @self
  - aura{auraname=nl_winged_c2;d=120;i=20;maxStacks=1;overwriteAll=true;CancelOnDeath=false} @self
  - aura{auraname=nl_winged_c3;d=120;i=20;maxStacks=1;overwriteAll=true;CancelOnDeath=false} @self
  - aura{auraname=nl_winged_c4;d=120;i=20;maxStacks=1;overwriteAll=true;CancelOnDeath=false} @self
  - aura{auraname=nl_winged_c5;d=120;i=20;maxStacks=1;overwriteAll=true;CancelOnDeath=false} @self

# Jump-key input while airborne: 1s guard against key-repeat over-consumption.
NL_ENCHANT_WINGED_TRY:
  Cooldown: 1
  Conditions:
  - onground false
  Skills:
  - skill{s=NL_ENCHANT_WINGED_USE_C1} @self
  - skill{s=NL_ENCHANT_WINGED_USE_C2} @self
  - skill{s=NL_ENCHANT_WINGED_USE_C3} @self
  - skill{s=NL_ENCHANT_WINGED_USE_C4} @self
  - skill{s=NL_ENCHANT_WINGED_USE_C5} @self

# One consume chain per charge; only the matching one passes.
NL_ENCHANT_WINGED_USE_C1:
  Conditions:
  - hasaura{aura=nl_winged_c1} true
  Skills:
  - auraremove{aura=nl_winged_c1} @self
  - delay 2
  - skill{s=NL_ENCHANT_WINGED_LEAP} @self ?!onground
  - skill{s=NL_ENCHANT_WINGED_FINALCHK} @self

NL_ENCHANT_WINGED_USE_C2:
  Conditions:
  - hasaura{aura=nl_winged_c2} true
  Skills:
  - auraremove{aura=nl_winged_c2} @self
  - delay 2
  - skill{s=NL_ENCHANT_WINGED_LEAP} @self ?!onground
  - skill{s=NL_ENCHANT_WINGED_FINALCHK} @self

NL_ENCHANT_WINGED_USE_C3:
  Conditions:
  - hasaura{aura=nl_winged_c3} true
  Skills:
  - auraremove{aura=nl_winged_c3} @self
  - delay 2
  - skill{s=NL_ENCHANT_WINGED_LEAP} @self ?!onground
  - skill{s=NL_ENCHANT_WINGED_FINALCHK} @self

NL_ENCHANT_WINGED_USE_C4:
  Conditions:
  - hasaura{aura=nl_winged_c4} true
  Skills:
  - auraremove{aura=nl_winged_c4} @self
  - delay 2
  - skill{s=NL_ENCHANT_WINGED_LEAP} @self ?!onground
  - skill{s=NL_ENCHANT_WINGED_FINALCHK} @self

NL_ENCHANT_WINGED_USE_C5:
  Conditions:
  - hasaura{aura=nl_winged_c5} true
  Skills:
  - auraremove{aura=nl_winged_c5} @self
  - delay 2
  - skill{s=NL_ENCHANT_WINGED_LEAP} @self ?!onground
  - skill{s=NL_ENCHANT_WINGED_FINALCHK} @self

# The directional impulse: up + forward in the player's facing (r=true makes
# z the forward axis). Constants only (delayed context).
NL_ENCHANT_WINGED_LEAP:
  Skills:
  - velocity{m=ADD;x=0;y=0.45;z=0.35;r=true} @self
  - skill{s=NL_VFX_WING_FLAP} @self

# Finisher feedback when the LAST charge was just consumed.
NL_ENCHANT_WINGED_FINALCHK:
  Conditions:
  - hasaura{aura=nl_winged_c1} false
  - hasaura{aura=nl_winged_c2} false
  - hasaura{aura=nl_winged_c3} false
  - hasaura{aura=nl_winged_c4} false
  - hasaura{aura=nl_winged_c5} false
  Skills:
  - skill{s=NL_VFX_WING_FINISH} @self
